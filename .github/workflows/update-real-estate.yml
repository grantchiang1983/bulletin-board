name: 🔄 Update Real Estate Data (Daily 07:00 AM, 180 Days History)

on:
  schedule:
    # 每日早上 07:00 (台灣時間 UTC+8) 自動執行
    # 07:00 AM Taipei = 23:00 UTC (前一日晚上 11:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 支援手動一鍵觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Update Script (Update & Maintain 180 Days History)
        run: |
          if [ -f "scripts/update_real_estate.py" ]; then
            python scripts/update_real_estate.py
          elif [ -f "bulletin-board/scripts/update_real_estate.py" ]; then
            python bulletin-board/scripts/update_real_estate.py
          fi

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/real-estate-data.json bulletin-board/data/real-estate-data.json || true
          git diff --staged --quiet || (git commit -m "chore(data): 每日早上07:00自動更新實價登錄 (保留近180天紀錄) [skip ci]" && git push)
